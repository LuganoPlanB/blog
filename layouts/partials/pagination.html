{{- if gt .TotalPages 1 -}}
<nav class="pagination" aria-label="Pagination">
  {{- with .Prev }}<a href="{{ .URL }}" rel="prev">← Newer</a>{{ else }}<span></span>{{ end -}}
  <span>Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  {{- with .Next }}<a href="{{ .URL }}" rel="next">Older →</a>{{ else }}<span></span>{{ end -}}
</nav>
{{- end -}}
